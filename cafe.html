<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bunny Café</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --pill:rgba(255,251,243,.88); --pill-ink:#3a2c26; --pill-ink2:#8a7b70; --pill-line:rgba(90,63,49,.18); color-scheme:light; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --pill:rgba(42,36,31,.86); --pill-ink:#efe7dc; --pill-ink2:#a59a8d; --pill-line:rgba(255,240,220,.14); color-scheme:dark; } }
:root[data-theme="dark"]{ --pill:rgba(42,36,31,.86); --pill-ink:#efe7dc; --pill-ink2:#a59a8d; --pill-line:rgba(255,240,220,.14); color-scheme:dark; }
html,body{ margin:0; background:transparent; }
.cafe{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:14px; background:#3b2e27; font-family:Inter,"Noto Sans KR",system-ui,sans-serif; }
.cafe canvas{ position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
.hud{ position:absolute; top:3%; right:2%; display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:var(--pill); border:1px solid var(--pill-line); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:var(--pill-ink); box-shadow:0 4px 14px rgba(40,25,15,.12); }
.hud button{ font:inherit; color:inherit; background:transparent; border:0; border-radius:999px; height:30px; min-width:30px; padding:0 9px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.hud button:hover{ background:rgba(120,90,70,.10); }
.hud button:disabled{ opacity:.35; cursor:default; background:transparent; }
.hud .mode{ font-size:12px; color:var(--pill-ink2); }
.hud .time{ font-family:"DM Mono",ui-monospace,monospace; font-size:15px; letter-spacing:.02em; padding:0 6px; min-width:52px; text-align:center; }
.hud svg{ width:14px; height:14px; fill:currentColor; }
.hud .on{ color:#6f7d68; }
.hint{ position:absolute; left:2%; bottom:3.5%; font-size:12px; color:var(--pill-ink); background:var(--pill); border:1px solid var(--pill-line); border-radius:999px; padding:6px 12px; transition:opacity .4s; pointer-events:none; }
.hint.hide{ opacity:0; }
@media (max-width:480px){ .hud button{ height:26px; min-width:26px; padding:0 6px; } .hud .time{ font-size:13px; min-width:44px; } .hud .mode{ font-size:11px; } .hint{ font-size:11px; } }
</style>
</head>
<body>
<div class="cafe" id="cafe">
  <canvas id="c" width="320" height="180" role="img" aria-label="Pixel café where bunnies study at tables"></canvas>
  <div class="hud" role="group" aria-label="Focus timer and music">
    <button class="mode" id="mode" title="Change session length">Focus 25</button>
    <span class="time" id="time" aria-live="polite">25:00</span>
    <button id="play" title="Start" aria-label="Start timer"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></button>
    <button id="reset" title="Reset" aria-label="Reset timer"><svg viewBox="0 0 16 16"><path d="M8 3a5 5 0 1 1-4.6 3H1.5L4.5 2.8 7.5 6H5.6A3.2 3.2 0 1 0 8 4.8z"/></svg></button>
    <button id="music" title="Lo-fi music" aria-label="Toggle lo-fi music" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M6 2.5l8-1.5v9.2a2.2 2.2 0 1 1-1.5-2.1V4.2L7.5 5.1v6.6A2.2 2.2 0 1 1 6 9.6z"/></svg></button>
  </div>
  <div class="hint" id="hint">Tap an empty table to sit</div>
</div>

let env={phase:'day', weather:'clear', code:0, flash:0, sunrise:6.5, sunset:18};
function bpHour(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Budapest',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const h=+p.find(x=>x.type==='hour').value%24, m=+p.find(x=>x.type==='minute').value; return {h,m,f:h+m/60};
}
function bpMonth(){ return +new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Budapest',month:'numeric'}).format(new Date())-1; }
const SR=[7.4,6.9,6.1,6.1,5.3,4.9,5.1,5.7,6.3,6.9,6.6,7.3], SS=[16.4,17.1,17.8,19.5,20.1,20.5,20.4,19.8,18.9,17.9,16.3,16.0];
function updatePhase(){
  const t=bpHour().f, sr=env.sunrise, ss=env.sunset;
  env.phase = (t<sr-0.7||t>ss+0.8)?'night' : (t<sr+0.8)?'dawn' : (t>ss-0.9)?'dusk' : 'day';
  if(CFG.phase) env.phase=CFG.phase;
  if(CFG.weather) env.weather=CFG.weather;
}
function weatherFromCode(c){
  if([95,96,99].includes(c)) return 'storm';
  if((c>=71&&c<=77)||c===85||c===86) return 'snow';
  if((c>=51&&c<=67)||(c>=80&&c<=82)) return 'rain';
  if(c===45||c===48) return 'fog';
  if(c===2||c===3) return 'cloudy';
  return 'clear';
}
async function fetchWeather(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}&current=weather_code&daily=sunrise,sunset&timezone=Europe%2FBudapest&forecast_days=1`;
    const r=await fetch(u); const d=await r.json();
    env.code=d.current.weather_code; env.weather=weatherFromCode(env.code);
    const hm=s=>{ const t=s.split('T')[1].split(':'); return +t[0]+(+t[1])/60; };
    env.sunrise=hm(d.daily.sunrise[0]); env.sunset=hm(d.daily.sunset[0]);
  }catch(e){ /* offline or blocked: keep time-of-day only */ }
  if(CFG.weather) env.weather=CFG.weather;
  updatePhase();
}

function drawOutside(tick){
  const ph=env.phase, wx=env.weather;
  let pal=SKY[ph];
  if((wx==='cloudy'||wx==='rain'||wx==='storm'||wx==='fog'||wx==='snow') && ph==='day') pal=SKY.cloudy;
  const ox=WINS[0].x, oy=WINS[0].y+3, span=WINS[2].x+WW-ox, gh=WH-6;
  ctx.save(); ctx.beginPath(); WINS.forEach(w=>ctx.rect(w.x+3,w.y+3,WW-6,WH-6)); ctx.clip();
  pal.b.forEach((col,i)=>P(ctx,ox,oy+i*Math.ceil(gh/4),span,Math.ceil(gh/4),col));
  // sun / moon
  const t=bpHour().f;
  if(wx==='clear'||wx==='cloudy'){
    if(ph==='night'){ const mx=ox+span*0.72, my=oy+5; P(ctx,mx,my,4,4,'#eee6cf'); P(ctx,mx+1,my-1,2,1,'#eee6cf'); P(ctx,mx+1,my+4,2,1,'#eee6cf'); P(ctx,mx-1,my+1,1,2,'#eee6cf'); P(ctx,mx+4,my+1,1,2,'#eee6cf'); P(ctx,mx+2,my,2,2,'#d8cfb6');
      for(let i=0;i<18;i++){ const sx=ox+((i*37)%span), sy=oy+((i*13)%10); if(((tick>>2)+i)%9) P(ctx,sx,sy,1,1,'#e9e4d2'); } }
    else { const f=Math.min(1,Math.max(0,(t-env.sunrise)/(env.sunset-env.sunrise))); const sx=ox+4+f*(span-12), sy=oy+12-Math.round(Math.sin(f*Math.PI)*9);
      const sc=ph==='day'?'#f6e7b8':'#f2c48f'; P(ctx,sx,sy,4,4,sc); P(ctx,sx+1,sy-1,2,1,sc); P(ctx,sx+1,sy+4,2,1,sc); P(ctx,sx-1,sy+1,1,2,sc); P(ctx,sx+4,sy+1,1,2,sc); }
  }
  // clouds
  const nC = wx==='clear'?2:4, cc = ph==='night'?'#4a5470':(wx==='rain'||wx==='storm')?'#b3b9ba':'#f4f2ec';
  for(let i=0;i<nC;i++){ const cl=clouds[i]; const x=ox+((cl.x+tick*0.05*(i+1))%(span+30))-20;
    P(ctx,x+2,oy+cl.y,cl.w-4,1,cc); P(ctx,x,oy+cl.y+1,cl.w,2,cc); P(ctx,x+3,oy+cl.y-1,5,1,cc); P(ctx,x+1,oy+cl.y+3,cl.w-2,1,'rgba(0,0,0,.05)'); }
  // Mecsek hills + cathedral + trees
  for(let i=0;i<span;i++){ const hh=hills[i]; P(ctx,ox+i,oy+hh,1,gh-hh,pal.hill); }
  const cx=ox+span*0.45|0, base=oy+hills[cx-ox]-1;
  [[0,7],[6,7],[1,5],[5,5]].forEach(([dx,hh],k)=>P(ctx,cx+dx,base-hh,1,hh, k<2?pal.tree:pal.tree));
  P(ctx,cx,base-3,7,3,pal.tree); P(ctx,cx+2,base-5,3,2,pal.tree);
  if(pal.city){ for(let i=0;i<span;i+=5){ const y=oy+hills[i]+2+(i%3); if((i*7)%3) P(ctx,ox+i,y,1,1,pal.city); } }
  for(let i=0;i<span;i++){ const th=trees[i]; P(ctx,ox+i,oy+th,1,gh-th,pal.tree); }
  // weather
  if(wx==='rain'||wx==='storm'){
    drops.forEach(d=>{ d.y+=2.2; d.x-=0.6; if(d.y>gh){ d.y=-2; d.x=Math.random()*(span+10); }
      P(ctx,ox+d.x,oy+d.y,1,2,ph==='night'?'#7d8aa3':'#a7b4bb'); });
    if(wx==='storm' && Math.random()<0.006) env.flash=3;
  }
  if(wx==='snow'){ flakes.forEach(f=>{ f.y+=f.s; f.x+=Math.sin((tick+f.y)/9)*0.3; if(f.y>gh){ f.y=-1; f.x=Math.random()*span; } P(ctx,ox+f.x,oy+f.y,1,1,'#fbfaf5'); }); }
  if(wx==='fog'){ for(let i=0;i<3;i++){ P(ctx,ox,oy+10+i*5,span,3,'rgba(240,240,236,.35)'); } }
  if(env.flash>0){ P(ctx,ox,oy,span,gh,'rgba(255,255,255,.55)'); env.flash--; }
  ctx.restore();
}

function drawBunny(x0,y0,o,blink,dip){
  const pal=Object.assign({},OUTFITS[o.outfit],FURS[o.fur]);
  for(let y=0;y<BUN.length;y++){ const r=BUN[y]; const yy=(dip&&y<20)?y+1:y;
    for(let x=0;x<r.length;x++){ let ch=r[x]; if(ch==='.') continue;
      if(blink&&y===14&&(x===7||x===15)) ch='W';
      if(blink&&y===15&&[6,8,14,16].includes(x)) ch='E';
      if(ch==='N') ch='E';
      P(ctx,x0+x,y0+yy,1,1,pal[ch]); } }
  return pal;
}

function lighting(){
  const ph=env.phase, wx=env.weather;
  let a=0, col='rgba(25,22,45,';
  if(ph==='night') a=.40; else if(ph==='dusk'){ a=.14; col='rgba(110,60,40,'; } else if(ph==='dawn'){ a=.10; col='rgba(90,70,90,'; }
  if(ph==='day'&&(wx==='rain'||wx==='storm'||wx==='snow'||wx==='fog')) { a=.12; col='rgba(60,65,80,'; }
  if(a>0){ ctx.fillStyle=col+a+')'; ctx.fillRect(0,0,W,H); }
  const glow=(x,y,r,s)=>{ const g=ctx.createRadialGradient(x,y,1,x,y,r); g.addColorStop(0,`rgba(255,214,150,${s})`); g.addColorStop(1,'rgba(255,214,150,0)'); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2); };
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const k = ph==='night'?1:ph==='day'&&(wx==='clear'||wx==='cloudy')?0.35:0.65;
  SEATS.forEach(s=>glow(s.cx,s.cy-10,34,.16*k));
  glow(195,15,20,.30*k); glow(243,15,20,.30*k); glow(24,40,26,.18*k);
  ctx.restore();
  if(ph!=='night'){ ctx.save(); ctx.globalCompositeOperation='lighter'; const k2=ph==='day'?.06:.04;
    WINS.forEach(w=>{ ctx.fillStyle=`rgba(255,246,220,${k2})`; ctx.beginPath(); ctx.moveTo(w.x+3,w.y+WH); ctx.lineTo(w.x+WW-3,w.y+WH); ctx.lineTo(w.x+WW+14,w.y+WH+40); ctx.lineTo(w.x+12,w.y+WH+40); ctx.fill(); });
    ctx.restore(); }
}

let tick=0, hover=null;
function clockHands(){
  const {h,m}=bpHour(), cx=139, cy=13;
  const ang=(v)=>v*Math.PI*2-Math.PI/2;
  const line=(a,len,col)=>{ for(let i=1;i<=len;i++) P(ctx,Math.round(cx+Math.cos(a)*i),Math.round(cy+Math.sin(a)*i),1,1,col); };
  line(ang(m/60),4,'#5a3f31'); line(ang(((h%12)+m/60)/12),3,'#5a3f31'); P(ctx,cx,cy,1,1,'#985f44');
}
function frame(){
  tick++;
  ctx.clearRect(0,0,W,H);
  drawOutside(tick);
  ctx.drawImage(bg,0,0);
  if(env.weather==='snow') WINS.forEach(w=>P(ctx,w.x-3,w.y+WH,WW+6,1,'#fbfaf5'));
  clockHands();
  steam(164,WINS[0].y+WH-4,tick);
  SEATS.forEach((s,i)=>{
    const o=npcs[i]||(me.seat===i?me:null);
    spr(ctx,'chair',s.cx-13,s.cy-17);
    let pal=null;
    if(o){ const t=tick+o.phase; const studying=o===me?(timer.running&&mode.key!=='break'):true;
      pal=drawBunny(s.cx-11,s.cy-33,o,(t%44)<2,studying&&(t%26)>=17); }
    drawTable(s.cx,s.cy,hover===i&&!o);
    if(o){
      if(o.item==='laptop') spr(ctx,'laptop',s.cx-8,s.cy-12); else { spr(ctx,'book_open',s.cx-8,s.cy-6); if(((tick+o.phase)%70)<3) P(ctx,s.cx+1,s.cy-8,5,6,'#fffaf0'); }
      [[-11],[8]].forEach(([dx])=>{ P(ctx,s.cx+dx,s.cy-6,4,3,pal.O); P(ctx,s.cx+dx+1,s.cy-6,2,2,pal.W); });
      spr(ctx,'mug',s.cx+13,s.cy-6); steam(s.cx+13,s.cy-6,tick+o.phase);
    }
  });
  lighting();
}

// ---------- lo-fi (generated live, no external files) ----------
let A=null, out=null, playing=false, sched=null, nextT=0, step=0, crackle=null, rainSrc=null, ext=null;
const BPM=72, SPB=60/BPM, E8=SPB/2;
const CH=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
const mtf=m=>440*Math.pow(2,(m-69)/12);
function noiseBuf(sec){ const b=A.createBuffer(1,A.sampleRate*sec,A.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function initAudio(){
  A=new (window.AudioContext||window.webkitAudioContext)();
  const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2100; lp.Q.value=.6;
  const comp=A.createDynamicsCompressor(); out=A.createGain(); out.gain.value=0;
  lp.connect(comp); comp.connect(out); out.connect(A.destination); A._in=lp;
  // vinyl crackle (은은하게 — 치직거림을 약하게)
  const b=A.createBuffer(1,A.sampleRate*4,A.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*0.018 + (Math.random()<0.00028?(Math.random()*2-1)*0.5:0); }
  crackle=A.createBufferSource(); crackle.buffer=b; crackle.loop=true; const cg=A.createGain(); cg.gain.value=.14; const cf=A.createBiquadFilter(); cf.type='highpass'; cf.frequency.value=1000;
  crackle.connect(cf); cf.connect(cg); cg.connect(lp); crackle.start();
  // rain bed (only audible when it rains outside)
  rainSrc=A.createBufferSource(); rainSrc.buffer=noiseBuf(3); rainSrc.loop=true; const rf=A.createBiquadFilter(); rf.type='lowpass'; rf.frequency.value=1100; A._rainG=A.createGain(); A._rainG.gain.value=0;
  rainSrc.connect(rf); rf.connect(A._rainG); A._rainG.connect(lp); rainSrc.start();
  A._nb=noiseBuf(1);
}
function keys(t,midi,dur,vel){
  const f=mtf(midi), g=A.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+0.015); g.gain.exponentialRampToValueAtTime(vel*0.35,t+0.5); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const o1=A.createOscillator(); o1.type='sine'; o1.frequency.value=f; o1.detune.value=-4;
  const o2=A.createOscillator(); o2.type='triangle'; o2.frequency.value=f*2; o2.detune.value=5; const g2=A.createGain(); g2.gain.value=.12;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(A._in); o1.start(t); o2.start(t); o1.stop(t+dur+.05); o2.stop(t+dur+.05);
}
function bass(t,midi,dur){ const o=A.createOscillator(), g=A.createGain(); o.type='sine'; o.frequency.value=mtf(midi);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.28,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(A._in); o.start(t); o.stop(t+dur+.05); }
function kick(t){ const o=A.createOscillator(), g=A.createGain(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(42,t+.14);
  g.gain.setValueAtTime(.55,t); g.gain.exponentialRampToValueAtTime(.0001,t+.25); o.connect(g); g.connect(A._in); o.start(t); o.stop(t+.3); }
function hit(t,type,freq,vel,dec){ const s=A.createBufferSource(); s.buffer=A._nb; const f=A.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=A.createGain();
  g.gain.setValueAtTime(vel,t); g.gain.exponentialRampToValueAtTime(.0001,t+dec); s.connect(f); f.connect(g); g.connect(A._in); s.start(t); s.stop(t+dec+.02); }
const MEL=[72,74,76,79,81,84];
function schedule(){
  while(nextT < A.currentTime+0.15){
    const s=step%32, bar=Math.floor(step/8)%4, beat8=step%8;
    const swing = (beat8%2) ? E8*0.18 : 0, t=nextT+swing;
    if(beat8===0){ CH[bar].forEach((n,i)=>keys(t+i*0.018,n,SPB*3.6,.09)); bass(t,CH[bar][0]-12,SPB*1.6); }
    if(beat8===5) bass(t,CH[bar][0]-12,SPB*1.2);
    if(beat8===0||beat8===5) kick(t);
    if(beat8===2||beat8===6) hit(t,'bandpass',1700,.16,.16);
    hit(t,'highpass',7000,beat8%2?.035:.05,.045);
    if(Math.random()<.16 && beat8%2===0) keys(t,MEL[Math.floor(Math.random()*MEL.length)],SPB*1.5,.05);
    nextT+=E8; step++;
  }
  A._rainG.gain.setTargetAtTime((env.weather==='rain'||env.weather==='storm')?.06:0, A.currentTime, 1);
}
function chime(){ if(!A) return; const t=A.currentTime+.05; [76,81,88].forEach((n,i)=>keys(t+i*.18,n,1.6,.08)); if(!playing){ out.gain.setTargetAtTime(.7,A.currentTime,.05); setTimeout(()=>{ if(!playing) out.gain.setTargetAtTime(0,A.currentTime,.3); },2200); } }
$('music').onclick=async()=>{
  const btn=$('music');
  if(CFG.music){
    if(!ext){ ext=new Audio(CFG.music); ext.loop=true; ext.volume=.6; }
    if(playing){ ext.pause(); playing=false; } else { try{ await ext.play(); playing=true; }catch(e){} }
  } else {
    if(!A) initAudio();
    if(A.state==='suspended') await A.resume();
    if(playing){ out.gain.setTargetAtTime(0,A.currentTime,.4); clearInterval(sched); playing=false; }
    else { nextT=A.currentTime+.1; sched=setInterval(schedule,25); out.gain.setTargetAtTime(.7,A.currentTime,.6); playing=true; }
  }
  btn.classList.toggle('on',playing); btn.setAttribute('aria-pressed',playing);
};
})();
